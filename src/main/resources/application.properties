spring.application.name=demo10

# ✅ PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/intelli-tower
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# ✅ Hibernate config - back to update to preserve data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ✅ SQL Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ✅ Server port
server.port=8088

# ✅ Upload configuration for 3D models
app.upload.path=uploads/models

# ✅ File upload size limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework=DEBUG

# application.properties
spring.mvc.converters.preferred-json-mapper=jackson
