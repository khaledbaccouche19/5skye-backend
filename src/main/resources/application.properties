spring.application.name=demo10

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/intelli-tower
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate config - back to update to preserve data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL Logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Server port
server.port=8088

# Upload configuration for 3D models
app.upload.path=uploads/models

# CORS allowed origins (comma-separated). Example: http://localhost:3000,https://app.example.com
app.cors.allowed-origins=http://localhost:3000

# File upload size limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework=DEBUG

# application.properties
spring.mvc.converters.preferred-json-mapper=jackson

# JWT Configuration
jwt.secret=mySecretKey123456789012345678901234567890
jwt.expiration=86400000

# SiteBoss Configuration
siteboss.host=10.9.1.19
siteboss.username=admin
siteboss.password=password
siteboss.script.path=../siteboss-project/siteboss_api_debug.py
siteboss.output.path=../siteboss-project/backend_data.json
# Scheduler config for automatic SiteBoss pulls
siteboss.scheduler.enabled=true
siteboss.scheduler.delay-ms=120000
siteboss.scheduler.initial-delay-ms=2000

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
